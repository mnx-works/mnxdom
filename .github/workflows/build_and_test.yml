name: Build and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }} (C++${{ matrix.standard }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            generator: Ninja
            standard: 20
          - os: macos-latest
            generator: Ninja
            standard: 23
          - os: windows-latest
            generator: Ninja
            standard: 23
    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # Step 2: Display Preinstalled Tools
      - name: Display preinstalled tools
        run: |
          cmake --version

      # Step 3: Install Ninja (if needed)
      - name: Install Ninja on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja on macOS
        if: matrix.os == 'macos-latest'
        run: brew install ninja || echo "Ninja already installed"

      - name: Install Ninja on Windows
        if: matrix.os == 'windows-latest'
        run: |
          ninja --version && echo "Ninja already installed" || choco install ninja -y

      - name: Verify Ninja Installation
        run: ninja --version || echo "Ninja is not available on this platform"

      # Step 4: Configure CMake
      - name: Configure CMake
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.standard }}

      # Step 5: Build with CMake
      - name: Build
        run: cmake --build build --parallel 2

      # Step 6: Run tests
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # Step 7: Install with CMake
      - name: Install
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p /tmp/prefix
          cmake --install build --prefix /tmp/prefix
